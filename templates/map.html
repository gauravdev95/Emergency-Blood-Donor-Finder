{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>{% endblock %}
{% block content %}
<div class="card"><h1>Nearby Donors Map (Agra)</h1><p class="lead">Markers = registered donors. Click a marker for group &amp; locality. Phones are masked here unless the donor consented.</p>
<div id="map"></div></div>
<script>async function load(){const donors=await (await fetch('/api/donors')).json();
const map=L.map('map').setView([27.20,78.00],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
donors.forEach(d=>{if(d.latitude&&d.longitude){L.marker([d.latitude,d.longitude]).addTo(map)
.bindPopup(`<b>${d.name}</b><br>Group: ${d.blood_group}<br>${d.locality||''}<br>Available: ${d.available?'Yes':'No'}<br>Contact: ${d.phone_display}`);}});}
load();</script>
{% endblock %}
